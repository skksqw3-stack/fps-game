name: Build Kotlin Android Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "ZIP NOT FOUND"; exit 1; fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project root
        id: locate
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Gradle Wrapper (v8.2)
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          if [ -f "gradlew" ]; then chmod +x gradlew; exit 0; fi
          mkdir -p gradle/wrapper
          wget -q "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar" -O gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(cd "${0%/*}" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          if [ -n "$JAVA_HOME" ] ; then JAVACMD=$JAVA_HOME/bin/java; else JAVACMD=java; fi
          exec "$JAVACMD" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      # ⬇️ مرحله جدید: اصلاح خودکار ناسازگاری نسخه جاوا و کاتلین
      - name: Fix Java/Kotlin JVM Target Mismatch
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          echo "🔍 اصلاح فایل app/build.gradle..."
          # تنظیم هر دو روی نسخه 17
          sed -i 's/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/g' app/build.gradle
          sed -i 's/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/g' app/build.gradle
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" app/build.gradle
          sed -i 's/jvmTarget = "1.7"/jvmTarget = "17"/g' app/build.gradle
          sed -i "s/jvmTarget = '1.7'/jvmTarget = '17'/g" app/build.gradle
          
          # اگر اصلا تنظیمات jvmTarget وجود نداشت، آن را اضافه می‌کنیم
          if ! grep -q 'jvmTarget' app/build.gradle; then
            sed -i '/android {/a \ \ \ \ kotlinOptions {\n        jvmTarget = "17"\n    }' app/build.gradle
          fi
          
          echo "✅ تنظیمات اعمال شد. محتوای بخش android:"
          grep -A 10 "android {" app/build.gradle || true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          EXIT=$?
          tail -n 100 build.log
          if [ $EXIT -ne 0 ]; then
            echo "===== خطاهای اصلی ====="
            grep -nE "FAILURE|What went wrong|error:|Caused by|Unsupported|incompatible|Could not" build.log | head -n 40
            exit $EXIT
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.locate.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
