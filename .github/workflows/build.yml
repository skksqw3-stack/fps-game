      - name: Setup Gradle Wrapper (Manual)
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          set +e

          if [ -f "gradlew" ]; then
            echo "✅ gradlew موجود است"
            chmod +x gradlew
            exit 0
          fi

          echo "⚠️ gradlew نیست — دریافت مستقیم از مخزن رسمی Gradle"

          # نسخه Gradle مناسب برای AGP 7.x (پیش‌فرض امن)
          GRADLE_VERSION="7.5"
          
          # ساخت پوشه wrapper
          mkdir -p gradle/wrapper

          # ۱. دانلود فایل gradle-wrapper.jar از مخزن رسمی Gradle
          # (این فایل مخصوص نسخه ۷.۵ است)
          wget -q "https://raw.githubusercontent.com/gradle/gradle/v7.5.0/gradle/wrapper/gradle-wrapper.jar" \
               -O gradle/wrapper/gradle-wrapper.jar
          
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "❌ دانلود gradle-wrapper.jar شکست خورد"
            exit 1
          fi

          # ۲. ساخت فایل gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # ۳. ساخت فایل gradlew (اسکریپت شل)
          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(cd "${0%/*}" && pwd -P)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD=$JAVA_HOME/bin/java
          else
              JAVACMD=java
          fi
          exec "$JAVACMD" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

          # ۴. ساخت فایل gradlew.bat (برای ویندوز - اختیاری)
          cat > gradlew.bat <<'EOF'
          @rem Gradle startup script for Windows
          @if "%DEBUG%"=="" @echo off
          set DIRNAME=%~dp0
          if "%DIRNAME%"=="" set DIRNAME=.
          set APP_BASE_NAME=%~n0
          set APP_HOME=%DIRNAME%
          set CLASSPATH=%APP_HOME%\gradle\wrapper\gradle-wrapper.jar
          if defined JAVA_HOME goto findJavaFromJavaHome
          set JAVA_EXE=java.exe
          goto execute
          :findJavaFromJavaHome
          set JAVA_EXE=%JAVA_HOME%\bin\java.exe
          :execute
          "%JAVA_EXE%" %DEFAULT_JVM_OPTS% %JAVA_OPTS% -classpath "%CLASSPATH%" org.gradle.wrapper.GradleWrapperMain %*
          EOF

          echo "✅ gradlew و wrapper به صورت دستی ساخته شدند"
          ls -la gradlew gradle/wrapper/
