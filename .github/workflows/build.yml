name: Build Kotlin Android Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⬇️ JDK 11 برای سازگاری با AGP قدیمی (اگر پروژه جدید است 17 بگذارید)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Extract ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "✅ ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project root
        id: locate
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs -r dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "✅ پروژه: $PROJECT_DIR"

      # ⬇️ نمایش محتوای gradle.properties و build.gradle برای تشخیص نسخه‌ها
      - name: Show project versions
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          echo "===== build.gradle (root) ====="
          cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null
          echo ""
          echo "===== app/build.gradle ====="
          cat app/build.gradle 2>/dev/null || cat app/build.gradle.kts 2>/dev/null
          echo ""
          echo "===== gradle.properties ====="
          cat gradle.properties 2>/dev/null
          echo ""
          echo "===== gradle/wrapper (اگر وجود دارد) ====="
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "وجود ندارد"

      # ⬇️ ساخت gradlew با نسخه‌ای که پروژه انتظار دارد
      - name: Setup Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          if [ -f "gradlew" ]; then
            echo "✅ gradlew موجود است"
            chmod +x gradlew
            exit 0
          fi

          # حدس زدن نسخه Gradle از AGP
          AGP_VERSION=$(grep -oE "com.android.tools.build:gradle:[0-9.]+" build.gradle 2>/dev/null | head -n1 | grep -oE "[0-9.]+$")
          echo "AGP version detected: ${AGP_VERSION:-UNKNOWN}"

          case "$AGP_VERSION" in
            8.*) GRADLE_VERSION="8.7" ;;
            7.4*|7.3*) GRADLE_VERSION="7.5" ;;
            7.*) GRADLE_VERSION="7.4.2" ;;
            4.*|3.*) GRADLE_VERSION="6.7.1" ;;
            *) GRADLE_VERSION="7.5" ;;  # پیش‌فرض محتاطانه
          esac
          echo "⬇️ دانلود Gradle $GRADLE_VERSION"
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION} --no-daemon
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      # ⬇️ بیلد با نمایش کامل خطا
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info > build.log 2>&1
          EXIT_CODE=$?
          echo "===== آخرین ۸۰ خط لاگ ====="
          tail -n 80 build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "===== جستجوی خطاهای اصلی ====="
            grep -nE "FAILURE|What went wrong|error:|Caused by|Could not|Unsupported|incompatible|requires" build.log | head -n 40
            echo ""
            echo "===== ۲۰ خط قبل از اولین FAILURE ====="
            LINE=$(grep -n "FAILURE" build.log | head -n1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              START=$((LINE > 20 ? LINE - 20 : 1))
              sed -n "${START},${LINE}p" build.log
            fi
            exit $EXIT_CODE
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.locate.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
