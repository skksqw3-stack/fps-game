name: Build Kotlin Android Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # استخراج ZIP
      - name: Extract ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ هیچ فایل ZIP پیدا نشد!"
            exit 1
          fi
          echo "✅ فایل ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "محتوای extracted:"
          ls -la extracted

      # پیدا کردن مسیر پروژه (جایی که settings.gradle هست)
      - name: Locate project root
        id: locate
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ settings.gradle پیدا نشد!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "✅ پوشه پروژه: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # اگر gradlew نبود، خودمان Gradle Wrapper را می‌سازیم
      - name: Setup Gradle Wrapper if missing
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew نیست — در حال ساخت Gradle Wrapper..."

            # نسخه Gradle را از فایل‌های پروژه یا پیش‌فرض تعیین کن
            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties 2>/dev/null | sed 's/.*gradle-\(.*\)-bin.zip/\1/' || echo "8.7")
            if [ -z "$GRADLE_VERSION" ]; then GRADLE_VERSION="8.7"; fi
            echo "استفاده از Gradle نسخه: $GRADLE_VERSION"

            # دانلود Gradle
            wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp

            # ساخت wrapper با Gradle دانلودشده
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION} --no-daemon

            chmod +x gradlew
            echo "✅ gradlew ساخته شد"
          else
            echo "✅ gradlew از قبل وجود دارد"
            chmod +x gradlew
          fi
          ls -la

      # کش Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ساخت APK دیباگ
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # آپلود APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.locate.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
