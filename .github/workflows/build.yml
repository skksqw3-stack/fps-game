      - name: Setup Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.PROJECT_DIR }}
        run: |
          set +e          # ⬅️  غیرفعال کردن خروج خودکار روی خطا
          set -x

          echo "===== شروع Setup Gradle Wrapper ====="

          if [ -f "gradlew" ]; then
            echo "✅ gradlew موجود است"
            chmod +x gradlew
            exit 0
          fi

          echo "⚠️ gradlew نیست — تعیین نسخه Gradle"

          # ⬇️ جستجو در همه فایل‌های ممکن، با || true که exit 1 grep را نادیده بگیرد
          AGP_VERSION=""
          AGP_VERSION=$(grep -rhoE "com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+" \
              --include="*.gradle" --include="*.gradle.kts" --include="*.toml" . 2>/dev/null \
              | head -n1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+$" || true)

          # اگر هنوز خالی است، از plugin block در settings.gradle هم امتحان کن
          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION=$(grep -rhoE "com\.android\.application[\"']? version [\"'][0-9]+\.[0-9]+\.[0-9]+" \
                --include="*.gradle" --include="*.gradle.kts" . 2>/dev/null \
                | grep -oE "[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)
          fi

          echo "AGP detected: '${AGP_VERSION}'"

          GRADLE_VERSION="7.5"
          case "$AGP_VERSION" in
            8.*) GRADLE_VERSION="8.7" ;;
            7.4*) GRADLE_VERSION="7.5" ;;
            7.3*) GRADLE_VERSION="7.4.2" ;;
            7.2*) GRADLE_VERSION="7.3.3" ;;
            7.1*) GRADLE_VERSION="7.2" ;;
            7.0*) GRADLE_VERSION="7.0.2" ;;
            4.*|3.*) GRADLE_VERSION="6.7.1" ;;
            "") echo "⚠️ AGP پیدا نشد — استفاده از Gradle 7.5 به عنوان پیش‌فرض" ;;
          esac
          echo "⬇️ Gradle version: $GRADLE_VERSION"

          echo "===== دانلود Gradle ====="
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          WGET_EXIT=$?
          echo "wget exit=$WGET_EXIT, size=$(stat -c%s /tmp/gradle.zip 2>/dev/null || echo 0)"
          if [ $WGET_EXIT -ne 0 ] || [ ! -s /tmp/gradle.zip ]; then
            echo "❌ دانلود Gradle شکست خورد"
            exit 1
          fi

          echo "===== استخراج Gradle ====="
          unzip -q /tmp/gradle.zip -d /tmp
          UNZIP_EXIT=$?
          echo "unzip exit=$UNZIP_EXIT"
          if [ $UNZIP_EXIT -ne 0 ]; then
            echo "❌ استخراج Gradle شکست خورد"
            exit 1
          fi

          ls -la /tmp/gradle-${GRADLE_VERSION}/bin/ || { echo "❌ پوشه gradle پیدا نشد"; exit 1; }

          echo "===== اجرای gradle wrapper ====="
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION} --no-daemon --stacktrace
          WRAPPER_EXIT=$?
          echo "gradle wrapper exit=$WRAPPER_EXIT"
          if [ $WRAPPER_EXIT -ne 0 ]; then
            echo "❌ ساخت wrapper شکست خورد"
            exit $WRAPPER_EXIT
          fi

          if [ ! -f "gradlew" ]; then
            echo "❌ gradlew بعد از اجرای wrapper هم ساخته نشد"
            ls -la
            exit 1
          fi

          chmod +x gradlew
          echo "✅ gradlew ساخته شد"
          set +x
